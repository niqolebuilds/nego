[project]
name = "negotiation-mcp"
version = "0.1.0"
description = "Negotiation decision engine for Siloam healthcare procurement, exposed as an MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "pydantic>=2.0"]

[project.scripts]
negotiation-mcp = "negotiation_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
